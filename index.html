<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Linha de Produção</title>
<style>
  :root{
    --bg: #14171a;
    --panel: #1c2126;
    --panel-2: #21272d;
    --border: #2c3339;
    --text: #e9ebee;
    --muted: #8b939b;
    --yellow: #f5c518;
    --red: #e0524b;
    --green: #3ecf8e;
    --blue: #5aa9e6;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(900px 500px at 15% -10%, rgba(90,169,230,0.08), transparent),
      radial-gradient(900px 500px at 100% 0%, rgba(245,197,24,0.06), transparent),
      linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0) 200px),
      var(--bg);
    color:var(--text);
    font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    padding:20px 20px 50px;
  }
  .wrap{max-width:1180px;margin:0 auto;}

  .hud{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
    align-items:stretch;
    margin-bottom:20px;
  }
  .hud-title{
    display:flex; align-items:center; gap:10px;
    font-size:20px; font-weight:800; letter-spacing:-0.01em;
    padding-right:6px;
  }
  .hud-title .icon{font-size:26px;}
  .chip{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:10px;
    padding:9px 16px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    min-width:110px;
    transition:box-shadow .2s;
  }
  .chip .lab{
    font-size:9.5px; color:var(--muted); letter-spacing:.08em; text-transform:uppercase;
  }
  .chip .val{
    font-family:"Courier New", Consolas, monospace;
    font-size:20px; font-weight:800;
  }
  .chip.gold .val{ color:var(--yellow); }
  .chip.goal{ min-width:190px; }
  .goal-bar{
    height:6px; border-radius:4px; background:var(--panel-2);
    margin-top:6px; overflow:hidden;
  }
  .goal-bar .fill{
    height:100%; border-radius:4px;
    background:linear-gradient(90deg, var(--blue), var(--green));
    width:0%;
    transition:width .25s;
  }
  .chip.pulse{ animation:chipPulse .5s ease-out; }
  @keyframes chipPulse{
    0%{ box-shadow:0 0 0 0 rgba(62,207,142,0.5); }
    100%{ box-shadow:0 0 0 12px rgba(62,207,142,0); }
  }

  .line{
    display:flex;
    align-items:flex-end;
    gap:6px;
    overflow-x:auto;
    padding:10px 4px 26px;
    margin-bottom:6px;
  }
  .cell{
    display:flex;
    align-items:flex-end;
    gap:6px;
    flex:0 0 auto;
  }
  .buffer{
    width:52px;
    min-height:110px;
    display:flex;
    flex-direction:column-reverse;
    align-items:center;
    gap:3px;
    padding:4px;
    border-radius:6px;
    background:rgba(255,255,255,0.02);
    border:1px solid transparent;
    transition:border-color .3s, background .3s;
    position:relative;
  }
  .buffer.overload{
    border-color:rgba(224,82,75,0.5);
    background:rgba(224,82,75,0.06);
  }
  .buffer.overload::after{
    content:"⚠";
    position:absolute; top:-13px; left:50%; transform:translateX(-50%);
    color:var(--red); font-size:13px;
  }
  .unit{
    width:22px;
    height:10px;
    border-radius:2px;
    background:var(--blue);
    flex:0 0 auto;
    animation:pop .22s ease-out;
  }
  @keyframes pop{ from{ transform:scaleX(0); opacity:0; } to{ transform:scaleX(1); opacity:1; } }
  .buffer-count{
    font-family:"Courier New", monospace;
    font-size:11px;
    color:var(--muted);
    text-align:center;
    margin-top:2px;
  }

  .arrow{
    color:var(--border);
    font-size:20px;
    padding-bottom:44px;
    position:relative;
  }
  .arrow .flow-dot{
    position:absolute;
    top:50%; left:-2px;
    width:7px;height:7px;border-radius:50%;
    background:var(--green);
    box-shadow:0 0 8px rgba(62,207,142,0.9);
    opacity:0;
    transform:translateY(-50%);
  }
  .arrow.flowing .flow-dot{
    animation:flowMove .5s ease-in-out;
  }
  @keyframes flowMove{
    0%{ opacity:1; left:-2px; }
    85%{ opacity:1; }
    100%{ opacity:0; left:22px; }
  }

  .station{
    width:150px;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:12px;
    padding:12px;
    position:relative;
    transition:border-color .2s, box-shadow .2s, transform .15s;
    cursor:pointer;
  }
  .station:hover{ transform:translateY(-2px); border-color:var(--muted); }
  .station.bottleneck{
    border-color:var(--yellow);
    box-shadow:0 0 0 1px rgba(245,197,24,0.4), 0 0 22px rgba(245,197,24,0.15);
  }
  .station.bottleneck::before{
    content:"🐌";
    position:absolute;
    top:-13px;
    left:50%;
    transform:translateX(-50%);
    font-size:16px;
  }
  .station.just-changed{ animation:bottleneckShift .7s ease-out; }
  @keyframes bottleneckShift{
    0%{ box-shadow:0 0 0 0 rgba(245,197,24,0.6); }
    100%{ box-shadow:0 0 0 14px rgba(245,197,24,0); }
  }
  .station .hazard{
    position:absolute;
    inset:0;
    border-radius:12px;
    pointer-events:none;
    opacity:0;
    transition:opacity .2s;
    background: repeating-linear-gradient(45deg, rgba(245,197,24,0.10) 0 8px, rgba(0,0,0,0) 8px 16px);
  }
  .station.bottleneck .hazard{opacity:1;}

  .station .name{
    font-size:11px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--muted);
    margin-bottom:8px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .status-dot{
    width:7px;height:7px;border-radius:50%;
    background:var(--muted);
    flex:0 0 auto;
    transition:background .2s, box-shadow .2s;
  }
  .status-dot.busy{
    background:var(--green);
    box-shadow:0 0 6px rgba(62,207,142,0.8);
    animation:blink 1.1s ease-in-out infinite;
  }
  .status-dot.idle{
    background:var(--red);
    box-shadow:0 0 6px rgba(224,82,75,0.6);
  }
  @keyframes blink{ 0%,100%{opacity:1;} 50%{opacity:.45;} }

  .gear-wrap{ position:relative; width:34px; height:34px; margin:0 auto 10px; }
  .gear{
    width:34px;height:34px;
    border-radius:50%;
    border:3px solid var(--panel-2);
    border-top-color:var(--green);
    animation: spin linear infinite;
  }
  .gear.idle{ border-top-color:var(--panel-2); animation-play-state:paused; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .util-bar{
    height:4px; border-radius:3px; background:var(--panel-2);
    margin:8px 0 6px; overflow:hidden;
  }
  .util-bar .fill{
    height:100%; border-radius:3px;
    background:var(--green);
    width:0%;
    transition:width .25s;
  }

  .rate-row{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom:4px;
  }
  .rate-row .rv{
    font-family:"Courier New", monospace;
    font-weight:700;
    font-size:15px;
  }
  .rate-row .ru{
    font-size:10px;
    color:var(--muted);
  }
  input[type=range]{
    width:100%;
    accent-color: var(--yellow);
  }

  .out{
    width:76px;
    text-align:center;
    padding-bottom:10px;
    position:relative;
  }
  .out .box{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:10px;
    padding:14px 6px;
    transition:transform .15s;
    position:relative;
    overflow:visible;
  }
  .out .box.bump{ animation:bump .25s ease-out; }
  @keyframes bump{ 0%{transform:scale(1.15);} 100%{transform:scale(1);} }
  .out .num{
    font-family:"Courier New", monospace;
    font-size:22px;
    font-weight:800;
    color:var(--green);
  }
  .out .lab{
    font-size:18px;
    margin-top:2px;
  }
  .float-plus{
    position:absolute;
    top:-4px; left:50%;
    transform:translateX(-50%);
    color:var(--green);
    font-weight:800;
    font-size:14px;
    font-family:"Courier New", monospace;
    pointer-events:none;
    animation:floatUp .7s ease-out forwards;
  }
  @keyframes floatUp{
    from{ opacity:1; transform:translate(-50%, 0); }
    to{ opacity:0; transform:translate(-50%, -28px); }
  }

  .click-pop{
    position:absolute;
    top:-8px; left:50%;
    transform:translateX(-50%);
    background:var(--panel-2);
    border:1px solid var(--border);
    border-radius:6px;
    padding:2px 8px;
    font-family:"Courier New", monospace;
    font-size:12px;
    font-weight:700;
    color:var(--text);
    pointer-events:none;
    animation:floatUp .8s ease-out forwards;
    z-index:5;
  }

  .chart{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:10px;
    padding:14px 18px 10px;
    margin:18px 0;
  }
  .bars{
    display:flex;
    align-items:flex-end;
    gap:4px;
    height:70px;
  }
  .bar{
    flex:1;
    background:linear-gradient(180deg, var(--green), rgba(62,207,142,0.25));
    border-radius:3px 3px 0 0;
    min-height:2px;
    transition:height .3s;
  }
  .bar.bottleneck-limited{ background:linear-gradient(180deg, var(--yellow), rgba(245,197,24,0.2)); }

  .controls{
    display:flex;
    gap:10px;
    align-items:center;
    flex-wrap:wrap;
  }
  button{
    font-family:inherit;
    font-size:13px;
    font-weight:700;
    letter-spacing:0.03em;
    padding:11px 20px;
    border-radius:8px;
    border:1px solid var(--border);
    background:var(--panel);
    color:var(--text);
    cursor:pointer;
    transition:background .15s, border-color .15s, transform .1s;
  }
  button:hover{border-color:var(--muted);}
  button:active{ transform:scale(0.97); }
  button.primary{
    background:var(--green);
    color:#0f1512;
    border-color:var(--green);
  }
  button.primary:hover{filter:brightness(1.08);}
  button.ghost{background:transparent;}

  .speed-group{
    display:flex; gap:4px; margin-left:auto;
    background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:3px;
  }
  .speed-group button{
    padding:6px 10px; font-size:11px; border:none; background:transparent;
  }
  .speed-group button.active{ background:var(--yellow); color:#1a1a1a; }

  .win-overlay{
    position:fixed; inset:0;
    background:rgba(10,12,14,0.72);
    display:flex; align-items:center; justify-content:center;
    z-index:60;
    opacity:0; pointer-events:none;
    transition:opacity .25s;
  }
  .win-overlay.show{ opacity:1; pointer-events:auto; }
  .win-card{
    background:var(--panel);
    border:1px solid var(--yellow);
    border-radius:16px;
    padding:32px 40px;
    text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,0.5);
    transform:scale(.85);
    transition:transform .25s;
  }
  .win-overlay.show .win-card{ transform:scale(1); }
  .win-card .trophy{ font-size:48px; margin-bottom:6px; }
  .win-card .time{
    font-family:"Courier New", monospace;
    font-size:34px; font-weight:800; color:var(--yellow);
    margin:6px 0;
  }
  .win-card .record{
    font-size:12.5px; color:var(--muted); margin-bottom:18px;
  }
  .win-card .record b{ color:var(--green); }

  .confetti{
    position:fixed; inset:0; pointer-events:none; z-index:61; overflow:hidden;
  }
  .confetti span{
    position:absolute; top:-20px;
    width:8px; height:14px;
    animation:confettiFall linear forwards;
  }
  @keyframes confettiFall{
    to{ transform:translateY(110vh) rotate(540deg); opacity:0.4; }
  }

  @media (max-width:700px){
    .line{ flex-direction:column; align-items:stretch; }
    .cell{ flex-direction:row; }
    .arrow{ display:none; }
    .station{ width:100%; }
    .hud{ flex-direction:column; }
    .hud-title{ order:-1; }
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="hud">
    <div class="hud-title"><span class="icon">🏭</span> Linha de Produção</div>
    <div class="chip">
      <div class="lab">⏱ Tempo</div>
      <div class="val" id="simTime">00:00</div>
    </div>
    <div class="chip gold">
      <div class="lab">🏆 Recorde</div>
      <div class="val" id="bestTime">--:--</div>
    </div>
    <div class="chip goal">
      <div class="lab"><span id="finishedCount">0</span> / <span id="goalVal">60</span> peças</div>
      <div class="goal-bar"><div class="fill" id="goalFill"></div></div>
    </div>
  </div>

  <div class="line" id="line"><!-- gerado via JS --></div>

  <div class="chart">
    <div class="bars" id="bars"></div>
  </div>

  <div class="controls">
    <button class="primary" id="playBtn">▶ Iniciar</button>
    <button class="ghost" id="resetBtn">↺ Reiniciar</button>
    <div class="speed-group" id="speedGroup">
      <button data-speed="1" class="active">1x</button>
      <button data-speed="2">2x</button>
      <button data-speed="4">4x</button>
    </div>
  </div>

</div>

<div class="win-overlay" id="winOverlay">
  <div class="win-card">
    <div class="trophy">🏆</div>
    <div class="time" id="winTime">00:00</div>
    <div class="record" id="winRecord"></div>
    <button class="primary" id="winPlayAgain">🔁 De novo</button>
  </div>
</div>
<div class="confetti" id="confetti"></div>

<script>
(function(){
  const NUM_STATIONS = 5;
  const RATE_MIN = 1, RATE_MAX = 12; // un/min
  const DEFAULT_RATES = [8, 8, 3, 8, 8]; // estação 3 = gargalo proposital
  const MAX_VISIBLE_BUFFER = 10;
  const OVERLOAD_THRESHOLD = 8;
  const GOAL = 60;
  const BEST_KEY = 'toc_best_time_seconds';

  let rates = DEFAULT_RATES.slice(); // un/min
  let progress = new Array(NUM_STATIONS).fill(0);
  let buffer = new Array(NUM_STATIONS).fill(0); // fila de entrada de cada estação (buffer[0] não é usado, entrada infinita)
  let busy = new Array(NUM_STATIONS).fill(false);
  let busyTime = new Array(NUM_STATIONS).fill(0);
  let finished = 0;
  let simSeconds = 0;
  let running = false;
  let tickHandle = null;
  let historyBuckets = []; // produção por intervalo de 2s
  let lastFinishedAtBucket = 0;
  let bucketTimer = 0;
  const BUCKET_SECONDS = 2;
  const DT = 0.1; // segundos por tick
  let speedMult = 1;
  let prevBottleneck = null;
  let won = false;

  const lineEl = document.getElementById('line');
  const barsEl = document.getElementById('bars');
  const finishedEl = document.getElementById('finishedCount');
  const goalFillEl = document.getElementById('goalFill');
  const simTimeEl = document.getElementById('simTime');
  const bestTimeEl = document.getElementById('bestTime');
  const playBtn = document.getElementById('playBtn');
  const resetBtn = document.getElementById('resetBtn');
  const speedGroup = document.getElementById('speedGroup');
  const winOverlay = document.getElementById('winOverlay');
  const winTimeEl = document.getElementById('winTime');
  const winRecordEl = document.getElementById('winRecord');
  const winPlayAgain = document.getElementById('winPlayAgain');
  const confettiEl = document.getElementById('confetti');

  document.getElementById('goalVal').textContent = GOAL;

  function fmtTime(s){
    const m = Math.floor(s/60).toString().padStart(2,'0');
    const ss = Math.floor(s%60).toString().padStart(2,'0');
    return m + ':' + ss;
  }

  function loadBest(){
    const v = localStorage.getItem(BEST_KEY);
    bestTimeEl.textContent = v ? fmtTime(parseFloat(v)) : '--:--';
    return v ? parseFloat(v) : null;
  }
  let bestSeconds = loadBest();

  function bottleneckIndex(){
    let idx = 0;
    for(let i=1;i<rates.length;i++){ if(rates[i] < rates[idx]) idx = i; }
    return idx;
  }

  function popNumber(anchorEl, text, cls){
    const p = document.createElement('div');
    p.className = cls;
    p.textContent = text;
    anchorEl.appendChild(p);
    setTimeout(() => p.remove(), 800);
  }

  function buildLine(){
    lineEl.innerHTML = '';

    for(let i=0;i<NUM_STATIONS;i++){
      const bufCell = document.createElement('div');
      bufCell.className = 'cell';
      if(i > 0){
        const buf = document.createElement('div');
        buf.className = 'buffer';
        buf.id = 'buffer-' + i;
        const count = document.createElement('div');
        count.className = 'buffer-count';
        count.id = 'buffer-count-' + i;
        count.textContent = '0';
        bufCell.appendChild(buf);
        bufCell.appendChild(count);
      } else {
        const raw = document.createElement('div');
        raw.style.cssText = 'width:52px;min-height:110px;display:flex;align-items:center;justify-content:center;font-size:22px;';
        raw.textContent = '📦';
        bufCell.appendChild(raw);
      }
      lineEl.appendChild(bufCell);

      const st = document.createElement('div');
      st.className = 'station';
      st.id = 'station-' + i;
      st.innerHTML = `
        <div class="hazard"></div>
        <div class="name">${i+1} <span class="status-dot" id="dot-${i}"></span></div>
        <div class="gear-wrap"><div class="gear" id="gear-${i}" style="animation-duration:${(2 - rates[i]/RATE_MAX*1.5).toFixed(2)}s"></div></div>
        <div class="util-bar"><div class="fill" id="util-fill-${i}"></div></div>
        <div class="rate-row">
          <span class="rv" id="rate-val-${i}">${rates[i]}</span>
          <span class="ru">un/min</span>
        </div>
        <input type="range" min="${RATE_MIN}" max="${RATE_MAX}" step="1" value="${rates[i]}" id="rate-slider-${i}">
      `;
      lineEl.appendChild(st);
      st.addEventListener('click', (e) => {
        if(e.target.tagName === 'INPUT') return;
        const pct = simSeconds > 0 ? Math.round((busyTime[i]/simSeconds)*100) : 0;
        popNumber(st, pct + '%', 'click-pop');
      });

      const arrow = document.createElement('div');
      arrow.className = 'arrow';
      arrow.id = 'arrow-' + i;
      arrow.innerHTML = '→<span class="flow-dot"></span>';
      lineEl.appendChild(arrow);
    }

    const outCell = document.createElement('div');
    outCell.className = 'cell out';
    outCell.innerHTML = `
      <div class="box" id="out-box">
        <div class="num" id="out-num">0</div>
        <div class="lab">✅</div>
      </div>
    `;
    lineEl.appendChild(outCell);

    for(let i=0;i<NUM_STATIONS;i++){
      document.getElementById('rate-slider-' + i).addEventListener('input', (e) => {
        rates[i] = parseInt(e.target.value, 10);
        document.getElementById('rate-val-' + i).textContent = rates[i];
        document.getElementById('gear-' + i).style.animationDuration = (2 - rates[i]/RATE_MAX*1.5).toFixed(2) + 's';
        refreshBottleneckStyling();
      });
    }
    refreshBottleneckStyling();
  }

  function refreshBottleneckStyling(){
    const bIdx = bottleneckIndex();
    for(let i=0;i<NUM_STATIONS;i++){
      document.getElementById('station-' + i).classList.toggle('bottleneck', i === bIdx);
    }
    if(prevBottleneck !== null && prevBottleneck !== bIdx){
      const el = document.getElementById('station-' + bIdx);
      el.classList.remove('just-changed');
      void el.offsetWidth;
      el.classList.add('just-changed');
    }
    prevBottleneck = bIdx;
  }

  function renderBuffers(){
    for(let i=1;i<NUM_STATIONS;i++){
      const el = document.getElementById('buffer-' + i);
      const countEl = document.getElementById('buffer-count-' + i);
      const n = buffer[i];
      countEl.textContent = n;
      el.classList.toggle('overload', n >= OVERLOAD_THRESHOLD);
      const currentUnits = el.querySelectorAll('.unit').length;
      const visible = Math.min(n, MAX_VISIBLE_BUFFER);
      if(visible > currentUnits){
        for(let k=currentUnits;k<visible;k++){
          const u = document.createElement('div');
          u.className = 'unit';
          el.appendChild(u);
        }
      } else if(visible < currentUnits){
        for(let k=currentUnits;k>visible;k--){
          el.removeChild(el.lastElementChild);
        }
      }
    }
  }

  function renderBars(){
    barsEl.innerHTML = '';
    const bIdx = bottleneckIndex();
    const bottleneckRatePerBucket = (rates[bIdx]/60) * BUCKET_SECONDS;
    const maxVal = Math.max(1, ...historyBuckets, bottleneckRatePerBucket * 1.3);
    historyBuckets.slice(-20).forEach(v => {
      const bar = document.createElement('div');
      bar.className = 'bar' + (v <= bottleneckRatePerBucket + 0.5 ? ' bottleneck-limited' : '');
      bar.style.height = Math.max(2, (v / maxVal) * 70) + 'px';
      barsEl.appendChild(bar);
    });
  }

  function launchConfetti(){
    const colors = ['#f5c518', '#3ecf8e', '#5aa9e6', '#e0524b', '#ffffff'];
    for(let i=0;i<80;i++){
      const s = document.createElement('span');
      s.style.left = Math.random()*100 + 'vw';
      s.style.background = colors[Math.floor(Math.random()*colors.length)];
      s.style.animationDuration = (1.6 + Math.random()*1.4) + 's';
      s.style.animationDelay = (Math.random()*0.4) + 's';
      s.style.opacity = 0.85;
      confettiEl.appendChild(s);
      setTimeout(() => s.remove(), 3500);
    }
  }

  function checkWin(){
    if(won || finished < GOAL) return;
    won = true;
    pause();
    launchConfetti();
    winTimeEl.textContent = fmtTime(simSeconds);
    if(bestSeconds === null || simSeconds < bestSeconds){
      localStorage.setItem(BEST_KEY, simSeconds.toString());
      bestSeconds = simSeconds;
      bestTimeEl.textContent = fmtTime(bestSeconds);
      winRecordEl.innerHTML = '🎉 <b>Novo recorde!</b>';
    } else {
      winRecordEl.innerHTML = 'Recorde: <b>' + fmtTime(bestSeconds) + '</b>';
    }
    winOverlay.classList.add('show');
  }

  function tick(){
    for(let s=0; s<speedMult; s++){
      simSeconds += DT;
      bucketTimer += DT;

      for(let i=0;i<NUM_STATIONS;i++){
        const rateSec = rates[i] / 60;
        const hasInput = (i === 0) ? true : buffer[i] > 0;
        busy[i] = hasInput;
        if(hasInput) busyTime[i] += DT;
        if(hasInput){
          progress[i] += rateSec * DT;
          if(progress[i] >= 1){
            progress[i] -= 1;
            if(i > 0) buffer[i] -= 1;
            const arrowEl = document.getElementById('arrow-' + i);
            if(arrowEl){
              arrowEl.classList.remove('flowing');
              void arrowEl.offsetWidth;
              arrowEl.classList.add('flowing');
            }
            if(i === NUM_STATIONS - 1){
              finished += 1;
              const box = document.getElementById('out-box');
              box.classList.remove('bump');
              void box.offsetWidth;
              box.classList.add('bump');
              popNumber(box, '+1', 'float-plus');
            } else {
              buffer[i+1] += 1;
            }
          }
        }
      }

      if(bucketTimer >= BUCKET_SECONDS){
        const produced = finished - lastFinishedAtBucket;
        historyBuckets.push(produced);
        if(historyBuckets.length > 40) historyBuckets.shift();
        lastFinishedAtBucket = finished;
        bucketTimer = 0;
      }
    }

    finishedEl.textContent = finished;
    document.getElementById('out-num').textContent = finished;
    simTimeEl.textContent = fmtTime(simSeconds);
    goalFillEl.style.width = Math.min(100, (finished/GOAL)*100) + '%';

    for(let i=0;i<NUM_STATIONS;i++){
      document.getElementById('dot-' + i).className = 'status-dot ' + (busy[i] ? 'busy' : 'idle');
      document.getElementById('gear-' + i).classList.toggle('idle', !busy[i]);
      const pct = simSeconds > 0 ? Math.min(100, Math.round((busyTime[i]/simSeconds)*100)) : 0;
      const fill = document.getElementById('util-fill-' + i);
      fill.style.width = pct + '%';
      fill.style.background = pct >= 85 ? 'var(--yellow)' : (pct <= 40 ? 'var(--red)' : 'var(--green)');
    }

    renderBuffers();
    renderBars();
    refreshBottleneckStyling();
    checkWin();
  }

  function start(){
    if(running || won) return;
    running = true;
    playBtn.textContent = '⏸ Pausar';
    tickHandle = setInterval(tick, DT*1000);
  }
  function pause(){
    running = false;
    playBtn.textContent = '▶ Continuar';
    clearInterval(tickHandle);
  }
  function reset(){
    pause();
    playBtn.textContent = '▶ Iniciar';
    rates = DEFAULT_RATES.slice();
    progress = new Array(NUM_STATIONS).fill(0);
    buffer = new Array(NUM_STATIONS).fill(0);
    busy = new Array(NUM_STATIONS).fill(false);
    busyTime = new Array(NUM_STATIONS).fill(0);
    finished = 0;
    simSeconds = 0;
    historyBuckets = [];
    lastFinishedAtBucket = 0;
    bucketTimer = 0;
    prevBottleneck = null;
    won = false;
    winOverlay.classList.remove('show');
    buildLine();
    renderBuffers();
    renderBars();
    finishedEl.textContent = '0';
    document.getElementById('out-num').textContent = '0';
    simTimeEl.textContent = '00:00';
    goalFillEl.style.width = '0%';
  }

  playBtn.addEventListener('click', () => running ? pause() : start());
  resetBtn.addEventListener('click', reset);
  winPlayAgain.addEventListener('click', () => { reset(); start(); });
  speedGroup.addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-speed]');
    if(!btn) return;
    speedMult = parseInt(btn.dataset.speed, 10);
    [...speedGroup.children].forEach(b => b.classList.toggle('active', b === btn));
  });

  buildLine();
  renderBuffers();
  renderBars();
})();
</script>
</body>
</html>
