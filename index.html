<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fábrica de Poções 8-Bit</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

  :root{
    --bg:#120a1f;
    --panel:#1e1233;
    --panel-2:#2c1c4a;
    --line:#f4e9ff;
    --muted:#a892d6;
    --yellow:#ffd23f;
    --red:#ff4d6d;
    --green:#39e6a4;
    --blue:#4ec9ff;
    --purple:#b48bff;
    --pink:#ff6fc7;
    --orange:#ff9f45;
  }
  *{box-sizing:border-box;}
  html, body{ height:100%; }
  body{
    margin:0;
    min-height:100vh;
    background-color: var(--bg);
    background-image:
      linear-gradient(rgba(0,0,0,0) 50%, rgba(0,0,0,0.35) 50%),
      radial-gradient(600px 380px at 10% 0%, rgba(255,111,199,0.20), transparent 60%),
      radial-gradient(700px 420px at 95% 10%, rgba(78,201,255,0.18), transparent 60%),
      radial-gradient(600px 400px at 40% 100%, rgba(180,139,255,0.18), transparent 60%);
    background-size: 100% 4px, auto, auto, auto;
    background-attachment: fixed;
    color:var(--line);
    font-family: "Press Start 2P", "Courier New", monospace;
    font-size:11px;
    line-height:1.6;
    padding:26px 24px 60px;
    display:flex;
    flex-direction:column;
  }
  .wrap{max-width:1400px;margin:auto;width:100%;}

  .hud{
    display:flex;
    gap:16px;
    flex-wrap:wrap;
    align-items:stretch;
    margin-bottom:26px;
  }
  .hud-title{
    display:flex; align-items:center; gap:12px;
    font-size:16px;
    color:var(--pink);
    text-shadow:3px 3px 0 #000;
    padding-right:10px;
  }
  .hud-title .icon{font-size:28px; display:inline-block; animation:wiggle 2.2s steps(2) infinite;}
  @keyframes wiggle{ 0%,100%{transform:rotate(-8deg);} 50%{transform:rotate(8deg);} }
  .chip{
    background:var(--panel);
    border:3px solid var(--line);
    border-radius:0;
    padding:12px 18px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    min-width:140px;
    box-shadow:5px 5px 0 #000;
  }
  .chip .lab{
    font-size:8px; color:var(--muted); letter-spacing:.05em; margin-bottom:8px;
  }
  .chip .val{
    font-family:"Press Start 2P", monospace;
    font-size:18px;
    color:var(--line);
    text-shadow:2px 2px 0 #000;
  }
  .chip.gold{ background:#3a2b06; border-color:var(--yellow); }
  .chip.gold .val{ color:var(--yellow); }
  .chip.gold .lab{ color:#d9a93f; }
  .chip.goal{ min-width:260px; background:#241645; border-color:var(--purple); }
  .chip.goal .lab{ color:var(--purple); }
  .chip.goal .val{ font-size:12px; }
  .goal-bar{
    height:14px; background:#000;
    margin-top:10px; overflow:hidden;
    border:2px solid var(--line);
  }
  .goal-bar .fill{
    height:100%;
    background:repeating-linear-gradient(90deg, var(--green) 0 6px, #1fae7f 6px 12px);
    width:0%;
    transition:width .25s;
  }
  .chip.pulse{ animation:chipPulse .5s steps(3); }
  @keyframes chipPulse{
    0%{ box-shadow:5px 5px 0 #000, 0 0 0 0 rgba(57,230,164,0.6); }
    100%{ box-shadow:5px 5px 0 #000, 0 0 0 14px rgba(57,230,164,0); }
  }

  .line{
    display:flex;
    align-items:flex-end;
    gap:10px;
    overflow-x:auto;
    overflow-y:visible;
    padding:22px 10px 32px;
    margin-bottom:10px;
    position:relative;
  }
  .line::before{
    content:"";
    position:absolute;
    left:0; right:0; bottom:16px;
    height:12px;
    background:repeating-linear-gradient(-45deg, var(--yellow) 0 12px, #000 12px 24px);
    animation:beltMove 1s steps(6) infinite;
  }
  @keyframes beltMove{ from{ background-position:0 0; } to{ background-position:-33.9px 0; } }
  .cell{
    display:flex;
    align-items:flex-end;
    gap:8px;
    flex:0 0 auto;
    position:relative;
    z-index:1;
  }
  .buffer{
    width:74px;
    min-height:140px;
    display:flex;
    flex-direction:column-reverse;
    align-items:center;
    gap:5px;
    padding:6px;
    background:#000;
    border:3px dashed var(--purple);
    transition:border-color .3s, background .3s;
    position:relative;
  }
  .buffer.overload{
    border-color:var(--red);
    border-style:solid;
    background:#3a0a14;
    animation:shake .4s steps(4);
  }
  @keyframes shake{
    0%,100%{ transform:translateX(0); }
    25%{ transform:translateX(-5px); }
    75%{ transform:translateX(5px); }
  }
  .buffer.overload::after{
    content:"!";
    position:absolute; top:-24px; left:50%; transform:translateX(-50%);
    color:var(--red); font-size:16px; text-shadow:2px 2px 0 #000;
    animation:blinkHard .5s steps(1) infinite;
  }
  @keyframes blinkHard{ 0%,49%{opacity:1;} 50%,100%{opacity:0;} }
  .unit{
    width:30px;
    height:30px;
    border-radius:0;
    border:2px solid var(--line);
    position:relative;
    flex:0 0 auto;
    display:flex; align-items:center; justify-content:center;
    font-size:15px;
    line-height:1;
    animation:pop .18s steps(3);
  }
  @keyframes pop{ from{ transform:scale(0); } to{ transform:scale(1); } }
  .buffer-count{
    font-family:"Press Start 2P", monospace;
    font-size:11px;
    color:var(--purple);
    text-align:center;
    margin-top:4px;
    text-shadow:1px 1px 0 #000;
  }

  .arrow{
    color:var(--line);
    font-size:22px;
    padding-bottom:60px;
    position:relative;
  }
  .arrow .flow-dot{
    position:absolute;
    top:50%; left:-2px;
    width:12px;height:12px;
    background:var(--green);
    border:2px solid #000;
    opacity:0;
    transform:translateY(-50%);
  }
  .arrow.flowing .flow-dot{
    animation:flowMove .5s steps(5);
  }
  @keyframes flowMove{
    0%{ opacity:1; left:-2px; }
    85%{ opacity:1; }
    100%{ opacity:0; left:26px; }
  }

  .station{
    width:210px;
    background:var(--panel);
    border:3px solid var(--line);
    border-radius:0;
    padding:16px;
    position:relative;
    transition:box-shadow .1s, transform .1s;
    cursor:pointer;
    box-shadow:6px 6px 0 #000;
  }
  .station:nth-of-type(4n+1){ border-color:var(--blue); }
  .station:nth-of-type(4n+2){ border-color:var(--pink); }
  .station:nth-of-type(4n+3){ border-color:var(--yellow); }
  .station:nth-of-type(4n+4){ border-color:var(--purple); }
  .station:hover{ transform:translate(-3px,-3px); box-shadow:9px 9px 0 #000; }
  .station.bottleneck{
    background:#3a0a14 !important;
    border-color:var(--red) !important;
    box-shadow:6px 6px 0 var(--red);
    animation:bottleneckBounce 1s steps(4) infinite;
  }
  @keyframes bottleneckBounce{
    0%,100%{ transform:translateY(0); }
    50%{ transform:translateY(-5px); }
  }
  .station.bottleneck::before{
    content:"🧚";
    position:absolute;
    top:-28px;
    left:50%;
    transform:translateX(-50%);
    font-size:26px;
    animation:wiggle .8s steps(2) infinite;
  }
  .station.just-changed{ animation:bottleneckShift .6s steps(4); }
  @keyframes bottleneckShift{
    0%{ box-shadow:6px 6px 0 var(--red), 0 0 0 0 rgba(255,77,109,0.6); }
    100%{ box-shadow:6px 6px 0 var(--red), 0 0 0 16px rgba(255,77,109,0); }
  }
  .station .hazard{
    position:absolute;
    inset:0;
    pointer-events:none;
    opacity:0;
    transition:opacity .2s;
    background: repeating-linear-gradient(45deg, rgba(255,77,109,0.15) 0 10px, rgba(0,0,0,0) 10px 20px);
  }
  .station.bottleneck .hazard{opacity:1;}

  .station .name{
    font-size:10px;
    color:var(--line);
    margin-bottom:14px;
    display:flex; align-items:center; justify-content:space-between;
    text-shadow:1px 1px 0 #000;
  }
  .status-dot{
    width:12px;height:12px;
    background:var(--muted);
    border:2px solid #000;
    flex:0 0 auto;
    transition:background .2s;
  }
  .status-dot.busy{
    background:var(--green);
    animation:blinkHard 1.1s steps(1) infinite;
  }
  .status-dot.idle{
    background:var(--red);
  }

  .gear-wrap{ width:44px; height:44px; margin:0 auto 14px; background:#000; border:2px solid var(--line); display:flex; align-items:center; justify-content:center; }
  .gear{
    font-size:24px;
    animation: gearBounce .5s steps(2) infinite alternate;
  }
  .gear.idle{ animation-play-state:paused; opacity:.4; }
  @keyframes gearBounce{ from{ transform:translateY(0) rotate(0deg); } to{ transform:translateY(-4px) rotate(25deg); } }

  .util-bar{
    height:10px; background:#000;
    margin:10px 0 10px; overflow:hidden;
    border:2px solid var(--line);
  }
  .util-bar .fill{
    height:100%;
    background:var(--green);
    width:0%;
    transition:width .25s;
  }

  .rate-row{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom:10px;
  }
  .rate-row .rv{
    font-family:"Press Start 2P", monospace;
    font-size:14px;
    color:var(--yellow);
    text-shadow:1px 1px 0 #000;
  }
  .rate-row .ru{
    font-size:7px;
    color:var(--muted);
  }
  input[type=range]{
    width:100%;
    -webkit-appearance:none;
    appearance:none;
    background:transparent;
    height:20px;
  }
  input[type=range]::-webkit-slider-runnable-track{
    width:100%; height:10px; background:#000; border:2px solid var(--line);
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;
    height:20px; width:14px;
    background:var(--pink);
    border:2px solid #000;
    margin-top:-6px;
    cursor:pointer;
  }
  input[type=range]::-moz-range-track{
    width:100%; height:10px; background:#000; border:2px solid var(--line);
  }
  input[type=range]::-moz-range-thumb{
    height:20px; width:14px;
    background:var(--pink);
    border:2px solid #000;
    border-radius:0;
    cursor:pointer;
  }

  .out{
    width:110px;
    text-align:center;
    padding-bottom:10px;
    position:relative;
  }
  .out .box{
    background:var(--green);
    border:3px solid var(--line);
    border-radius:0;
    padding:20px 8px;
    transition:transform .1s;
    position:relative;
    overflow:visible;
    box-shadow:6px 6px 0 #000;
  }
  .out .box.bump{ animation:bump .2s steps(3); }
  @keyframes bump{ 0%{transform:scale(1.2);} 100%{transform:scale(1);} }
  .out .num{
    font-family:"Press Start 2P", monospace;
    font-size:20px;
    color:#06331f;
    text-shadow:1px 1px 0 rgba(255,255,255,0.3);
  }
  .out .lab{
    font-size:22px;
    margin-top:6px;
  }
  .float-plus{
    position:absolute;
    top:-4px; left:50%;
    transform:translateX(-50%);
    color:var(--green);
    font-size:14px;
    font-family:"Press Start 2P", monospace;
    text-shadow:2px 2px 0 #000;
    pointer-events:none;
    animation:floatUp .7s steps(6) forwards;
  }
  @keyframes floatUp{
    from{ opacity:1; transform:translate(-50%, 0); }
    to{ opacity:0; transform:translate(-50%, -34px); }
  }

  .click-pop{
    position:absolute;
    top:-16px; left:50%;
    transform:translateX(-50%);
    background:#000;
    border:2px solid var(--line);
    padding:5px 12px;
    font-family:"Press Start 2P", monospace;
    font-size:11px;
    color:var(--yellow);
    pointer-events:none;
    animation:floatUp .8s steps(6) forwards;
    z-index:5;
  }

  .chart{
    background:var(--panel);
    border:3px solid var(--line);
    border-radius:0;
    padding:16px 20px 14px;
    margin:24px 0;
    box-shadow:6px 6px 0 #000;
  }
  .bars{
    display:flex;
    align-items:flex-end;
    gap:5px;
    height:90px;
  }
  .bar{
    flex:1;
    background:var(--blue);
    min-height:2px;
    transition:height .3s;
    border:2px solid #000;
    border-bottom:none;
  }
  .bar.bottleneck-limited{ background:var(--red); }

  .controls{
    display:flex;
    gap:14px;
    align-items:center;
    flex-wrap:wrap;
  }
  button{
    font-family:"Press Start 2P", monospace;
    font-size:11px;
    padding:16px 22px;
    border-radius:0;
    border:3px solid var(--line);
    background:var(--panel-2);
    color:var(--line);
    cursor:pointer;
    box-shadow:5px 5px 0 #000;
    transition:transform .08s, box-shadow .08s;
  }
  button:active{ transform:translate(4px,4px); box-shadow:1px 1px 0 #000; }
  button.primary{
    background:var(--green);
    color:#06331f;
    border-color:#06331f;
  }
  button.ghost{background:var(--panel);}

  .speed-group{
    display:flex; gap:0; margin-left:auto;
    border:3px solid var(--line);
    box-shadow:5px 5px 0 #000;
  }
  .speed-group button{
    padding:12px 16px; font-size:10px; border:none; background:var(--panel-2);
    box-shadow:none; border-right:2px solid var(--line);
  }
  .speed-group button:last-child{ border-right:none; }
  .speed-group button:active{ transform:none; box-shadow:none; }
  .speed-group button.active{ background:var(--yellow); color:#3a2b06; }

  .win-overlay{
    position:fixed; inset:0;
    background:rgba(6,3,15,0.82);
    display:flex; align-items:center; justify-content:center;
    z-index:60;
    opacity:0; pointer-events:none;
    transition:opacity .2s;
  }
  .win-overlay.show{ opacity:1; pointer-events:auto; }
  .win-card{
    background:var(--panel);
    border:4px solid var(--yellow);
    border-radius:0;
    padding:44px 52px;
    text-align:center;
    box-shadow:10px 10px 0 #000;
    transform:scale(.85);
    transition:transform .25s steps(6);
  }
  .win-overlay.show .win-card{ transform:scale(1); }
  .win-card .trophy{ font-size:56px; margin-bottom:10px; animation:wiggle 1s steps(2) infinite; }
  .win-card .time{
    font-family:"Press Start 2P", monospace;
    font-size:32px; color:var(--yellow);
    text-shadow:3px 3px 0 #000;
    margin:14px 0;
  }
  .win-card .record{
    font-size:10px; color:var(--muted); margin-bottom:24px;
  }
  .win-card .record b{ color:var(--green); }

  .confetti{
    position:fixed; inset:0; pointer-events:none; z-index:61; overflow:hidden;
  }
  .confetti span{
    position:absolute; top:-20px;
    width:10px; height:16px;
    border:2px solid #000;
    animation:confettiFall linear forwards;
  }
  @keyframes confettiFall{
    to{ transform:translateY(110vh) rotate(540deg); opacity:0.6; }
  }

  .wrap.screen-shake{ animation:screenShake .3s steps(6); }
  @keyframes screenShake{
    0%,100%{ transform:translate(0,0); }
    20%{ transform:translate(-7px,3px); }
    40%{ transform:translate(7px,-3px); }
    60%{ transform:translate(-5px,2px); }
    80%{ transform:translate(5px,-2px); }
  }

  @media (max-width:700px){
    .line{ flex-direction:column; align-items:stretch; }
    .line::before{ display:none; }
    .cell{ flex-direction:row; }
    .arrow{ display:none; }
    .station{ width:100%; }
    .hud{ flex-direction:column; }
    .hud-title{ order:-1; }
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="hud">
    <div class="hud-title"><span class="icon">🔮</span> FÁBRICA DE POÇÕES</div>
    <div class="chip">
      <div class="lab">TEMPO</div>
      <div class="val" id="simTime">00:00</div>
    </div>
    <div class="chip gold">
      <div class="lab">RECORDE</div>
      <div class="val" id="bestTime">--:--</div>
    </div>
    <div class="chip goal">
      <div class="lab"><span id="finishedCount">0</span> / <span id="goalVal">60</span> POÇÕES</div>
      <div class="goal-bar"><div class="fill" id="goalFill"></div></div>
    </div>
  </div>

  <div class="line" id="line"><!-- gerado via JS --></div>

  <div class="chart">
    <div class="bars" id="bars"></div>
  </div>

  <div class="controls">
    <button class="primary" id="playBtn">▶ START</button>
    <button class="ghost" id="resetBtn">↺ RESET</button>
    <div class="speed-group" id="speedGroup">
      <button data-speed="1" class="active">1X</button>
      <button data-speed="2">2X</button>
      <button data-speed="4">4X</button>
    </div>
  </div>

</div>

<div class="win-overlay" id="winOverlay">
  <div class="win-card">
    <div class="trophy">🏆</div>
    <div style="color:var(--line);">STAGE CLEAR!</div>
    <div class="time" id="winTime">00:00</div>
    <div class="record" id="winRecord"></div>
    <button class="primary" id="winPlayAgain">🔁 DE NOVO</button>
  </div>
</div>
<div class="confetti" id="confetti"></div>

<script>
(function(){
  const NUM_STATIONS = 5;
  const RATE_MIN = 1, RATE_MAX = 12; // un/min
  const DEFAULT_RATES = [8, 8, 3, 8, 8]; // estação 3 = gargalo proposital
  const MAX_VISIBLE_BUFFER = 10;
  const OVERLOAD_THRESHOLD = 8;
  const GOAL = 60;
  const BEST_KEY = 'toc_best_time_seconds';

  // cada máquina faz uma etapa diferente da poção
  const STATION_ICONS = ['✂️', '🥣', '🔥', '🧪', '🍾'];
  const STATION_LABELS = ['CORTE', 'MISTURA', 'FERVURA', 'FRASCO', 'SELO'];
  // como o item fica depois de passar por cada estação (buffer[i] = pós-estação i)
  const STAGE_ICONS = ['🥬', '🥣', '🍲', '🧪'];
  const STAGE_COLORS = ['#8bd450', '#ffd23f', '#ff9f45', '#4ec9ff'];

  let rates = DEFAULT_RATES.slice(); // un/min
  let progress = new Array(NUM_STATIONS).fill(0);
  let buffer = new Array(NUM_STATIONS).fill(0); // fila de entrada de cada estação (buffer[0] não é usado, entrada infinita)
  let busy = new Array(NUM_STATIONS).fill(false);
  let busyTime = new Array(NUM_STATIONS).fill(0);
  let finished = 0;
  let simSeconds = 0;
  let running = false;
  let tickHandle = null;
  let historyBuckets = []; // produção por intervalo de 2s
  let lastFinishedAtBucket = 0;
  let bucketTimer = 0;
  const BUCKET_SECONDS = 2;
  const DT = 0.1; // segundos por tick
  let speedMult = 1;
  let prevBottleneck = null;
  let won = false;
  let wasOverload = new Array(NUM_STATIONS).fill(false);

  const lineEl = document.getElementById('line');
  const barsEl = document.getElementById('bars');
  const finishedEl = document.getElementById('finishedCount');
  const goalFillEl = document.getElementById('goalFill');
  const simTimeEl = document.getElementById('simTime');
  const bestTimeEl = document.getElementById('bestTime');
  const playBtn = document.getElementById('playBtn');
  const resetBtn = document.getElementById('resetBtn');
  const speedGroup = document.getElementById('speedGroup');
  const winOverlay = document.getElementById('winOverlay');
  const winTimeEl = document.getElementById('winTime');
  const winRecordEl = document.getElementById('winRecord');
  const winPlayAgain = document.getElementById('winPlayAgain');
  const confettiEl = document.getElementById('confetti');

  document.getElementById('goalVal').textContent = GOAL;

  // --- som (sem arquivos externos, gerado na hora) ---
  let audioCtx = null;
  function ensureAudio(){
    if(!audioCtx){
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if(Ctx) audioCtx = new Ctx();
    }
    if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }
  function beep(freq, duration, type, gainPeak){
    const ctx = ensureAudio();
    if(!ctx) return;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type || 'square';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0, ctx.currentTime);
    gain.gain.linearRampToValueAtTime(gainPeak || 0.12, ctx.currentTime + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
    osc.connect(gain).connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + duration);
  }
  function sfxClick(){ beep(320, 0.05, 'square', 0.06); }
  function sfxPiece(){ beep(660, 0.09, 'triangle', 0.1); setTimeout(() => beep(880, 0.12, 'triangle', 0.09), 60); }
  function sfxOverload(){ beep(140, 0.35, 'sawtooth', 0.08); }
  function sfxWin(){
    [523,659,784,1047].forEach((f,i) => setTimeout(() => beep(f, 0.25, 'triangle', 0.11), i*110));
  }

  function screenShake(){
    const wrapEl = document.querySelector('.wrap');
    wrapEl.classList.remove('screen-shake');
    void wrapEl.offsetWidth;
    wrapEl.classList.add('screen-shake');
  }

  function fmtTime(s){
    const m = Math.floor(s/60).toString().padStart(2,'0');
    const ss = Math.floor(s%60).toString().padStart(2,'0');
    return m + ':' + ss;
  }

  function loadBest(){
    const v = localStorage.getItem(BEST_KEY);
    bestTimeEl.textContent = v ? fmtTime(parseFloat(v)) : '--:--';
    return v ? parseFloat(v) : null;
  }
  let bestSeconds = loadBest();

  function bottleneckIndex(){
    let idx = 0;
    for(let i=1;i<rates.length;i++){ if(rates[i] < rates[idx]) idx = i; }
    return idx;
  }

  function popNumber(anchorEl, text, cls){
    const p = document.createElement('div');
    p.className = cls;
    p.textContent = text;
    anchorEl.appendChild(p);
    setTimeout(() => p.remove(), 800);
  }

  function buildLine(){
    lineEl.innerHTML = '';

    for(let i=0;i<NUM_STATIONS;i++){
      const bufCell = document.createElement('div');
      bufCell.className = 'cell';
      if(i > 0){
        const buf = document.createElement('div');
        buf.className = 'buffer';
        buf.id = 'buffer-' + i;
        const count = document.createElement('div');
        count.className = 'buffer-count';
        count.id = 'buffer-count-' + i;
        count.textContent = '0';
        bufCell.appendChild(buf);
        bufCell.appendChild(count);
      } else {
        const raw = document.createElement('div');
        raw.style.cssText = 'width:68px;min-height:140px;display:flex;align-items:center;justify-content:center;font-size:28px;';
        raw.textContent = '🌿';
        bufCell.appendChild(raw);
      }
      lineEl.appendChild(bufCell);

      const st = document.createElement('div');
      st.className = 'station';
      st.id = 'station-' + i;
      st.innerHTML = `
        <div class="hazard"></div>
        <div class="name">${STATION_ICONS[i]} ${STATION_LABELS[i]} <span class="status-dot" id="dot-${i}"></span></div>
        <div class="gear-wrap"><div class="gear" id="gear-${i}" style="animation-duration:${(0.9 - rates[i]/RATE_MAX*0.6).toFixed(2)}s"><span>⚙️</span></div></div>
        <div class="util-bar"><div class="fill" id="util-fill-${i}"></div></div>
        <div class="rate-row">
          <span class="rv" id="rate-val-${i}">${rates[i]}</span>
          <span class="ru">UN/MIN</span>
        </div>
        <input type="range" min="${RATE_MIN}" max="${RATE_MAX}" step="1" value="${rates[i]}" id="rate-slider-${i}">
      `;
      lineEl.appendChild(st);
      st.addEventListener('click', (e) => {
        if(e.target.tagName === 'INPUT') return;
        const pct = simSeconds > 0 ? Math.round((busyTime[i]/simSeconds)*100) : 0;
        popNumber(st, pct + '%', 'click-pop');
      });

      const arrow = document.createElement('div');
      arrow.className = 'arrow';
      arrow.id = 'arrow-' + i;
      arrow.innerHTML = '→<span class="flow-dot"></span>';
      lineEl.appendChild(arrow);
    }

    const outCell = document.createElement('div');
    outCell.className = 'cell out';
    outCell.innerHTML = `
      <div class="box" id="out-box">
        <div class="num" id="out-num">0</div>
        <div class="lab">🍾</div>
      </div>
    `;
    lineEl.appendChild(outCell);

    for(let i=0;i<NUM_STATIONS;i++){
      document.getElementById('rate-slider-' + i).addEventListener('input', (e) => {
        rates[i] = parseInt(e.target.value, 10);
        document.getElementById('rate-val-' + i).textContent = rates[i];
        document.getElementById('gear-' + i).style.animationDuration = (0.9 - rates[i]/RATE_MAX*0.6).toFixed(2) + 's';
        refreshBottleneckStyling();
        sfxClick();
      });
    }
    refreshBottleneckStyling();
  }

  function refreshBottleneckStyling(){
    const bIdx = bottleneckIndex();
    for(let i=0;i<NUM_STATIONS;i++){
      document.getElementById('station-' + i).classList.toggle('bottleneck', i === bIdx);
    }
    if(prevBottleneck !== null && prevBottleneck !== bIdx){
      const el = document.getElementById('station-' + bIdx);
      el.classList.remove('just-changed');
      void el.offsetWidth;
      el.classList.add('just-changed');
    }
    prevBottleneck = bIdx;
  }

  function renderBuffers(){
    for(let i=1;i<NUM_STATIONS;i++){
      const el = document.getElementById('buffer-' + i);
      const countEl = document.getElementById('buffer-count-' + i);
      const n = buffer[i];
      countEl.textContent = n;
      const isOverload = n >= OVERLOAD_THRESHOLD;
      if(isOverload && !wasOverload[i]){
        screenShake();
        sfxOverload();
      }
      wasOverload[i] = isOverload;
      el.classList.toggle('overload', isOverload);
      const currentUnits = el.querySelectorAll('.unit').length;
      const visible = Math.min(n, MAX_VISIBLE_BUFFER);
      if(visible > currentUnits){
        for(let k=currentUnits;k<visible;k++){
          const u = document.createElement('div');
          u.className = 'unit';
          u.style.background = STAGE_COLORS[i-1];
          u.textContent = STAGE_ICONS[i-1];
          el.appendChild(u);
        }
      } else if(visible < currentUnits){
        for(let k=currentUnits;k>visible;k--){
          el.removeChild(el.lastElementChild);
        }
      }
    }
  }

  function renderBars(){
    barsEl.innerHTML = '';
    const bIdx = bottleneckIndex();
    const bottleneckRatePerBucket = (rates[bIdx]/60) * BUCKET_SECONDS;
    const maxVal = Math.max(1, ...historyBuckets, bottleneckRatePerBucket * 1.3);
    historyBuckets.slice(-20).forEach(v => {
      const bar = document.createElement('div');
      bar.className = 'bar' + (v <= bottleneckRatePerBucket + 0.5 ? ' bottleneck-limited' : '');
      bar.style.height = Math.max(2, (v / maxVal) * 70) + 'px';
      barsEl.appendChild(bar);
    });
  }

  function launchConfetti(){
    const colors = ['#ffd23f', '#39e6a4', '#4ec9ff', '#ff4d6d', '#ff6fc7'];
    for(let i=0;i<80;i++){
      const s = document.createElement('span');
      s.style.left = Math.random()*100 + 'vw';
      s.style.background = colors[Math.floor(Math.random()*colors.length)];
      s.style.animationDuration = (1.6 + Math.random()*1.4) + 's';
      s.style.animationDelay = (Math.random()*0.4) + 's';
      s.style.opacity = 0.9;
      confettiEl.appendChild(s);
      setTimeout(() => s.remove(), 3500);
    }
  }

  function checkWin(){
    if(won || finished < GOAL) return;
    won = true;
    pause();
    launchConfetti();
    sfxWin();
    winTimeEl.textContent = fmtTime(simSeconds);
    if(bestSeconds === null || simSeconds < bestSeconds){
      localStorage.setItem(BEST_KEY, simSeconds.toString());
      bestSeconds = simSeconds;
      bestTimeEl.textContent = fmtTime(bestSeconds);
      winRecordEl.innerHTML = '🎉 <b>NOVO RECORDE!</b>';
    } else {
      winRecordEl.innerHTML = 'RECORDE: <b>' + fmtTime(bestSeconds) + '</b>';
    }
    winOverlay.classList.add('show');
  }

  function tick(){
    for(let s=0; s<speedMult; s++){
      simSeconds += DT;
      bucketTimer += DT;

      for(let i=0;i<NUM_STATIONS;i++){
        const rateSec = rates[i] / 60;
        const hasInput = (i === 0) ? true : buffer[i] > 0;
        busy[i] = hasInput;
        if(hasInput) busyTime[i] += DT;
        if(hasInput){
          progress[i] += rateSec * DT;
          if(progress[i] >= 1){
            progress[i] -= 1;
            if(i > 0) buffer[i] -= 1;
            const arrowEl = document.getElementById('arrow-' + i);
            if(arrowEl){
              arrowEl.classList.remove('flowing');
              void arrowEl.offsetWidth;
              arrowEl.classList.add('flowing');
            }
            if(i === NUM_STATIONS - 1){
              finished += 1;
              const box = document.getElementById('out-box');
              box.classList.remove('bump');
              void box.offsetWidth;
              box.classList.add('bump');
              popNumber(box, '+1', 'float-plus');
              sfxPiece();
            } else {
              buffer[i+1] += 1;
            }
          }
        }
      }

      if(bucketTimer >= BUCKET_SECONDS){
        const produced = finished - lastFinishedAtBucket;
        historyBuckets.push(produced);
        if(historyBuckets.length > 40) historyBuckets.shift();
        lastFinishedAtBucket = finished;
        bucketTimer = 0;
      }
    }

    finishedEl.textContent = finished;
    document.getElementById('out-num').textContent = finished;
    simTimeEl.textContent = fmtTime(simSeconds);
    goalFillEl.style.width = Math.min(100, (finished/GOAL)*100) + '%';

    for(let i=0;i<NUM_STATIONS;i++){
      document.getElementById('dot-' + i).className = 'status-dot ' + (busy[i] ? 'busy' : 'idle');
      document.getElementById('gear-' + i).classList.toggle('idle', !busy[i]);
      const pct = simSeconds > 0 ? Math.min(100, Math.round((busyTime[i]/simSeconds)*100)) : 0;
      const fill = document.getElementById('util-fill-' + i);
      fill.style.width = pct + '%';
      fill.style.background = pct >= 85 ? 'var(--yellow)' : (pct <= 40 ? 'var(--red)' : 'var(--green)');
    }

    renderBuffers();
    renderBars();
    refreshBottleneckStyling();
    checkWin();
  }

  function start(){
    if(running || won) return;
    running = true;
    playBtn.textContent = '⏸ PAUSAR';
    tickHandle = setInterval(tick, DT*1000);
  }
  function pause(){
    running = false;
    playBtn.textContent = '▶ CONTINUAR';
    clearInterval(tickHandle);
  }
  function reset(){
    pause();
    playBtn.textContent = '▶ START';
    rates = DEFAULT_RATES.slice();
    progress = new Array(NUM_STATIONS).fill(0);
    buffer = new Array(NUM_STATIONS).fill(0);
    busy = new Array(NUM_STATIONS).fill(false);
    busyTime = new Array(NUM_STATIONS).fill(0);
    finished = 0;
    simSeconds = 0;
    historyBuckets = [];
    lastFinishedAtBucket = 0;
    bucketTimer = 0;
    prevBottleneck = null;
    won = false;
    wasOverload = new Array(NUM_STATIONS).fill(false);
    winOverlay.classList.remove('show');
    buildLine();
    renderBuffers();
    renderBars();
    finishedEl.textContent = '0';
    document.getElementById('out-num').textContent = '0';
    simTimeEl.textContent = '00:00';
    goalFillEl.style.width = '0%';
  }

  playBtn.addEventListener('click', () => { ensureAudio(); running ? pause() : start(); });
  resetBtn.addEventListener('click', reset);
  winPlayAgain.addEventListener('click', () => { reset(); start(); });
  speedGroup.addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-speed]');
    if(!btn) return;
    speedMult = parseInt(btn.dataset.speed, 10);
    [...speedGroup.children].forEach(b => b.classList.toggle('active', b === btn));
  });

  buildLine();
  renderBuffers();
  renderBars();
})();
</script>
</body>
</html>
