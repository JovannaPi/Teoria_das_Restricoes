<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fábrica de Poções</title>
<style>
  :root{
    --ink:#231646;
    --card:#fffaf0;
    --card-2:#fff0d6;
    --line:#231646;
    --muted:#6d5f97;
    --yellow:#ffcc33;
    --red:#ff5c72;
    --green:#28d9a8;
    --blue:#3fc1ff;
    --purple:#9b7bff;
    --pink:#ff7ab8;
    --orange:#ff9f45;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(700px 420px at 8% 0%, rgba(255,124,178,0.35), transparent 60%),
      radial-gradient(800px 460px at 95% 8%, rgba(63,193,255,0.30), transparent 60%),
      radial-gradient(700px 500px at 50% 100%, rgba(255,204,51,0.25), transparent 60%),
      #fef4e3;
    color:var(--ink);
    font-family: "Comic Sans MS", "Segoe UI Rounded", -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size:17px;
    padding:24px 24px 60px;
  }
  .wrap{max-width:1400px;margin:0 auto;}

  .hud{
    display:flex;
    gap:14px;
    flex-wrap:wrap;
    align-items:stretch;
    margin-bottom:22px;
  }
  .hud-title{
    display:flex; align-items:center; gap:12px;
    font-size:32px; font-weight:800; letter-spacing:-0.01em;
    padding-right:10px;
    color:var(--ink);
  }
  .hud-title .icon{font-size:42px; display:inline-block; animation:wiggle 2.2s ease-in-out infinite;}
  @keyframes wiggle{ 0%,100%{transform:rotate(-6deg);} 50%{transform:rotate(6deg);} }
  .chip{
    background:var(--card);
    border:4px solid var(--line);
    border-radius:16px;
    padding:12px 22px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    min-width:150px;
    box-shadow:5px 5px 0 var(--line);
  }
  .chip .lab{
    font-size:13px; color:var(--muted); letter-spacing:.06em; text-transform:uppercase; font-weight:700;
  }
  .chip .val{
    font-family:"Courier New", Consolas, monospace;
    font-size:30px; font-weight:800;
    color:var(--ink);
  }
  .chip.gold{ background:var(--yellow); }
  .chip.gold .val{ color:#3a2600; }
  .chip.gold .lab{ color:#6b4c00; }
  .chip.goal{ min-width:260px; background:var(--purple); }
  .chip.goal .lab, .chip.goal .val{ color:#fff; }
  .goal-bar{
    height:12px; border-radius:8px; background:rgba(255,255,255,0.35);
    margin-top:8px; overflow:hidden;
    border:2px solid var(--line);
  }
  .goal-bar .fill{
    height:100%;
    background:linear-gradient(90deg, var(--green), var(--yellow));
    width:0%;
    transition:width .25s;
  }
  .chip.pulse{ animation:chipPulse .5s ease-out; }
  @keyframes chipPulse{
    0%{ box-shadow:5px 5px 0 var(--line), 0 0 0 0 rgba(40,217,168,0.6); }
    100%{ box-shadow:5px 5px 0 var(--line), 0 0 0 14px rgba(40,217,168,0); }
  }

  .line{
    display:flex;
    align-items:flex-end;
    gap:8px;
    overflow-x:auto;
    padding:16px 10px 30px;
    margin-bottom:8px;
    position:relative;
    border-radius:20px;
  }
  .line::before{
    content:"";
    position:absolute;
    left:0; right:0; bottom:14px;
    height:14px;
    background:repeating-linear-gradient(-45deg, var(--yellow) 0 16px, var(--ink) 16px 32px);
    border-radius:8px;
    opacity:.85;
    animation:beltMove 1.2s linear infinite;
  }
  @keyframes beltMove{ from{ background-position:0 0; } to{ background-position:-45.25px 0; } }
  .cell{
    display:flex;
    align-items:flex-end;
    gap:8px;
    flex:0 0 auto;
    position:relative;
    z-index:1;
  }
  .buffer{
    width:70px;
    min-height:140px;
    display:flex;
    flex-direction:column-reverse;
    align-items:center;
    gap:4px;
    padding:6px;
    border-radius:12px;
    background:var(--card);
    border:3px dashed var(--purple);
    transition:border-color .3s, background .3s;
    position:relative;
  }
  .buffer.overload{
    border-color:var(--red);
    border-style:solid;
    background:#ffe1e5;
    animation:shake .4s ease-in-out;
  }
  @keyframes shake{
    0%,100%{ transform:translateX(0); }
    25%{ transform:translateX(-4px); }
    75%{ transform:translateX(4px); }
  }
  .buffer.overload::after{
    content:"💥";
    position:absolute; top:-20px; left:50%; transform:translateX(-50%);
    font-size:20px;
  }
  .unit{
    width:18px;
    height:22px;
    border-radius:3px 3px 10px 10px;
    background:linear-gradient(180deg, var(--pink), var(--purple));
    border:2px solid var(--line);
    position:relative;
    flex:0 0 auto;
    animation:pop .25s cubic-bezier(.34,1.56,.64,1);
  }
  .unit::before{
    content:"";
    position:absolute; top:-6px; left:50%; transform:translateX(-50%);
    width:8px; height:6px;
    background:var(--card-2);
    border:2px solid var(--line);
    border-radius:2px;
  }
  @keyframes pop{ from{ transform:scale(0); opacity:0; } to{ transform:scale(1); opacity:1; } }
  .buffer-count{
    font-family:"Courier New", monospace;
    font-size:15px;
    font-weight:800;
    color:var(--purple);
    text-align:center;
    margin-top:3px;
  }

  .arrow{
    color:var(--ink);
    font-size:30px;
    font-weight:800;
    padding-bottom:58px;
    position:relative;
  }
  .arrow .flow-dot{
    position:absolute;
    top:50%; left:-2px;
    width:12px;height:12px;border-radius:50%;
    background:var(--green);
    border:2px solid var(--line);
    opacity:0;
    transform:translateY(-50%);
  }
  .arrow.flowing .flow-dot{
    animation:flowMove .5s ease-in-out;
  }
  @keyframes flowMove{
    0%{ opacity:1; left:-2px; }
    85%{ opacity:1; }
    100%{ opacity:0; left:26px; }
  }

  .station{
    width:200px;
    background:var(--card);
    border:4px solid var(--line);
    border-radius:18px;
    padding:16px;
    position:relative;
    transition:box-shadow .2s, transform .15s;
    cursor:pointer;
    box-shadow:6px 6px 0 var(--line);
  }
  .station:nth-of-type(4n+1){ background:#e8f7ff; }
  .station:nth-of-type(4n+2){ background:#fff0f8; }
  .station:nth-of-type(4n+3){ background:#fff8e0; }
  .station:nth-of-type(4n+4){ background:#f1ecff; }
  .station:hover{ transform:translate(-3px,-3px); box-shadow:9px 9px 0 var(--line); }
  .station.bottleneck{
    background:#ffe4e4 !important;
    border-color:var(--red);
    box-shadow:6px 6px 0 var(--red);
    animation:bottleneckBounce 1.4s ease-in-out infinite;
  }
  @keyframes bottleneckBounce{
    0%,100%{ transform:translateY(0); }
    50%{ transform:translateY(-4px); }
  }
  .station.bottleneck::before{
    content:"🧚";
    position:absolute;
    top:-26px;
    left:50%;
    transform:translateX(-50%);
    font-size:30px;
    animation:wiggle 1s ease-in-out infinite;
  }
  .station.just-changed{ animation:bottleneckShift .7s ease-out; }
  @keyframes bottleneckShift{
    0%{ box-shadow:6px 6px 0 var(--red), 0 0 0 0 rgba(255,92,114,0.6); }
    100%{ box-shadow:6px 6px 0 var(--red), 0 0 0 16px rgba(255,92,114,0); }
  }
  .station .hazard{
    position:absolute;
    inset:0;
    border-radius:14px;
    pointer-events:none;
    opacity:0;
    transition:opacity .2s;
    background: repeating-linear-gradient(45deg, rgba(255,92,114,0.12) 0 10px, rgba(0,0,0,0) 10px 20px);
  }
  .station.bottleneck .hazard{opacity:1;}

  .station .name{
    font-size:17px;
    font-weight:800;
    color:var(--ink);
    margin-bottom:10px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .status-dot{
    width:13px;height:13px;border-radius:50%;
    background:var(--muted);
    border:2px solid var(--line);
    flex:0 0 auto;
    transition:background .2s;
  }
  .status-dot.busy{
    background:var(--green);
    animation:blink 1.1s ease-in-out infinite;
  }
  .status-dot.idle{
    background:var(--red);
  }
  @keyframes blink{ 0%,100%{opacity:1;} 50%{opacity:.4;} }

  .gear-wrap{ position:relative; width:50px; height:50px; margin:0 auto 12px; }
  .gear{
    width:50px;height:50px;
    border-radius:50%;
    border:6px solid var(--card-2);
    border-top-color:var(--purple);
    border-right-color:var(--pink);
    animation: spin .9s linear infinite;
  }
  .gear.idle{ border-top-color:var(--card-2); border-right-color:var(--card-2); animation-play-state:paused; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .util-bar{
    height:9px; border-radius:6px; background:var(--card-2);
    margin:10px 0 8px; overflow:hidden;
    border:2px solid var(--line);
  }
  .util-bar .fill{
    height:100%;
    background:var(--green);
    width:0%;
    transition:width .25s;
  }

  .rate-row{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom:6px;
  }
  .rate-row .rv{
    font-family:"Courier New", monospace;
    font-weight:800;
    font-size:22px;
    color:var(--ink);
  }
  .rate-row .ru{
    font-size:13px;
    color:var(--muted);
    font-weight:700;
  }
  input[type=range]{
    width:100%;
    height:22px;
    accent-color: var(--purple);
  }

  .out{
    width:104px;
    text-align:center;
    padding-bottom:10px;
    position:relative;
  }
  .out .box{
    background:var(--green);
    border:4px solid var(--line);
    border-radius:16px;
    padding:18px 8px;
    transition:transform .15s;
    position:relative;
    overflow:visible;
    box-shadow:6px 6px 0 var(--line);
  }
  .out .box.bump{ animation:bump .3s cubic-bezier(.34,1.56,.64,1); }
  @keyframes bump{ 0%{transform:scale(1.2) rotate(-4deg);} 100%{transform:scale(1) rotate(0);} }
  .out .num{
    font-family:"Courier New", monospace;
    font-size:32px;
    font-weight:800;
    color:#093a2c;
  }
  .out .lab{
    font-size:26px;
    margin-top:4px;
  }
  .float-plus{
    position:absolute;
    top:-4px; left:50%;
    transform:translateX(-50%);
    color:#0d5c44;
    font-weight:800;
    font-size:19px;
    font-family:"Courier New", monospace;
    pointer-events:none;
    animation:floatUp .7s ease-out forwards;
  }
  @keyframes floatUp{
    from{ opacity:1; transform:translate(-50%, 0); }
    to{ opacity:0; transform:translate(-50%, -32px); }
  }

  .click-pop{
    position:absolute;
    top:-14px; left:50%;
    transform:translateX(-50%);
    background:var(--ink);
    border:2px solid var(--line);
    border-radius:10px;
    padding:5px 14px;
    font-family:"Courier New", monospace;
    font-size:17px;
    font-weight:800;
    color:#fff;
    pointer-events:none;
    animation:floatUp .8s ease-out forwards;
    z-index:5;
  }

  .chart{
    background:var(--card);
    border:4px solid var(--line);
    border-radius:16px;
    padding:16px 20px 12px;
    margin:22px 0;
    box-shadow:6px 6px 0 var(--line);
  }
  .bars{
    display:flex;
    align-items:flex-end;
    gap:5px;
    height:90px;
  }
  .bar{
    flex:1;
    background:linear-gradient(180deg, var(--blue), var(--purple));
    border-radius:5px 5px 0 0;
    min-height:2px;
    transition:height .3s;
    border:2px solid var(--line);
    border-bottom:none;
  }
  .bar.bottleneck-limited{ background:linear-gradient(180deg, var(--yellow), var(--orange)); }

  .controls{
    display:flex;
    gap:12px;
    align-items:center;
    flex-wrap:wrap;
  }
  button{
    font-family:inherit;
    font-size:18px;
    font-weight:800;
    letter-spacing:0.02em;
    padding:15px 28px;
    border-radius:14px;
    border:4px solid var(--line);
    background:var(--card);
    color:var(--ink);
    cursor:pointer;
    box-shadow:5px 5px 0 var(--line);
    transition:transform .1s, box-shadow .1s;
  }
  button:hover{ transform:translate(-2px,-2px); box-shadow:7px 7px 0 var(--line); }
  button:active{ transform:translate(3px,3px); box-shadow:2px 2px 0 var(--line); }
  button.primary{
    background:var(--green);
    color:#093a2c;
  }
  button.ghost{background:var(--card-2);}

  .speed-group{
    display:flex; gap:5px; margin-left:auto;
    background:var(--card); border:4px solid var(--line); border-radius:14px; padding:5px;
    box-shadow:5px 5px 0 var(--line);
  }
  .speed-group button{
    padding:9px 16px; font-size:15px; border:none; background:transparent;
    box-shadow:none; border-radius:9px;
  }
  .speed-group button:hover{ transform:none; box-shadow:none; }
  .speed-group button:active{ transform:none; box-shadow:none; }
  .speed-group button.active{ background:var(--purple); color:#fff; }

  .win-overlay{
    position:fixed; inset:0;
    background:rgba(35,22,70,0.55);
    display:flex; align-items:center; justify-content:center;
    z-index:60;
    opacity:0; pointer-events:none;
    transition:opacity .25s;
  }
  .win-overlay.show{ opacity:1; pointer-events:auto; }
  .win-card{
    background:var(--card);
    border:5px solid var(--line);
    border-radius:26px;
    padding:44px 56px;
    text-align:center;
    box-shadow:12px 12px 0 var(--line);
    transform:scale(.8) rotate(-2deg);
    transition:transform .3s cubic-bezier(.34,1.56,.64,1);
  }
  .win-overlay.show .win-card{ transform:scale(1) rotate(0); }
  .win-card .trophy{ font-size:70px; margin-bottom:8px; animation:wiggle 1.4s ease-in-out infinite; }
  .win-card .time{
    font-family:"Courier New", monospace;
    font-size:48px; font-weight:800; color:var(--purple);
    margin:8px 0;
  }
  .win-card .record{
    font-size:17px; color:var(--muted); font-weight:700; margin-bottom:22px;
  }
  .win-card .record b{ color:var(--green); }

  .confetti{
    position:fixed; inset:0; pointer-events:none; z-index:61; overflow:hidden;
  }
  .confetti span{
    position:absolute; top:-20px;
    width:10px; height:16px;
    border:2px solid var(--line);
    animation:confettiFall linear forwards;
  }
  @keyframes confettiFall{
    to{ transform:translateY(110vh) rotate(540deg); opacity:0.6; }
  }

  .wrap.screen-shake{ animation:screenShake .35s ease-in-out; }
  @keyframes screenShake{
    0%,100%{ transform:translate(0,0); }
    20%{ transform:translate(-6px,3px); }
    40%{ transform:translate(6px,-3px); }
    60%{ transform:translate(-4px,2px); }
    80%{ transform:translate(4px,-2px); }
  }

  @media (max-width:700px){
    .line{ flex-direction:column; align-items:stretch; }
    .line::before{ display:none; }
    .cell{ flex-direction:row; }
    .arrow{ display:none; }
    .station{ width:100%; }
    .hud{ flex-direction:column; }
    .hud-title{ order:-1; }
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="hud">
    <div class="hud-title"><span class="icon">🔮</span> Fábrica de Poções</div>
    <div class="chip">
      <div class="lab">⏱ Tempo</div>
      <div class="val" id="simTime">00:00</div>
    </div>
    <div class="chip gold">
      <div class="lab">🏆 Recorde</div>
      <div class="val" id="bestTime">--:--</div>
    </div>
    <div class="chip goal">
      <div class="lab"><span id="finishedCount">0</span> / <span id="goalVal">60</span> poções</div>
      <div class="goal-bar"><div class="fill" id="goalFill"></div></div>
    </div>
  </div>

  <div class="line" id="line"><!-- gerado via JS --></div>

  <div class="chart">
    <div class="bars" id="bars"></div>
  </div>

  <div class="controls">
    <button class="primary" id="playBtn">▶ Iniciar</button>
    <button class="ghost" id="resetBtn">↺ Reiniciar</button>
    <div class="speed-group" id="speedGroup">
      <button data-speed="1" class="active">1x</button>
      <button data-speed="2">2x</button>
      <button data-speed="4">4x</button>
    </div>
  </div>

</div>

<div class="win-overlay" id="winOverlay">
  <div class="win-card">
    <div class="trophy">🏆</div>
    <div class="time" id="winTime">00:00</div>
    <div class="record" id="winRecord"></div>
    <button class="primary" id="winPlayAgain">🔁 De novo</button>
  </div>
</div>
<div class="confetti" id="confetti"></div>

<script>
(function(){
  const NUM_STATIONS = 5;
  const RATE_MIN = 1, RATE_MAX = 12; // un/min
  const DEFAULT_RATES = [8, 8, 3, 8, 8]; // estação 3 = gargalo proposital
  const MAX_VISIBLE_BUFFER = 10;
  const OVERLOAD_THRESHOLD = 8;
  const GOAL = 60;
  const BEST_KEY = 'toc_best_time_seconds';

  let rates = DEFAULT_RATES.slice(); // un/min
  let progress = new Array(NUM_STATIONS).fill(0);
  let buffer = new Array(NUM_STATIONS).fill(0); // fila de entrada de cada estação (buffer[0] não é usado, entrada infinita)
  let busy = new Array(NUM_STATIONS).fill(false);
  let busyTime = new Array(NUM_STATIONS).fill(0);
  let finished = 0;
  let simSeconds = 0;
  let running = false;
  let tickHandle = null;
  let historyBuckets = []; // produção por intervalo de 2s
  let lastFinishedAtBucket = 0;
  let bucketTimer = 0;
  const BUCKET_SECONDS = 2;
  const DT = 0.1; // segundos por tick
  let speedMult = 1;
  let prevBottleneck = null;
  let won = false;
  let wasOverload = new Array(NUM_STATIONS).fill(false);

  const lineEl = document.getElementById('line');
  const barsEl = document.getElementById('bars');
  const finishedEl = document.getElementById('finishedCount');
  const goalFillEl = document.getElementById('goalFill');
  const simTimeEl = document.getElementById('simTime');
  const bestTimeEl = document.getElementById('bestTime');
  const playBtn = document.getElementById('playBtn');
  const resetBtn = document.getElementById('resetBtn');
  const speedGroup = document.getElementById('speedGroup');
  const winOverlay = document.getElementById('winOverlay');
  const winTimeEl = document.getElementById('winTime');
  const winRecordEl = document.getElementById('winRecord');
  const winPlayAgain = document.getElementById('winPlayAgain');
  const confettiEl = document.getElementById('confetti');

  document.getElementById('goalVal').textContent = GOAL;

  // --- som (sem arquivos externos, gerado na hora) ---
  let audioCtx = null;
  function ensureAudio(){
    if(!audioCtx){
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if(Ctx) audioCtx = new Ctx();
    }
    if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }
  function beep(freq, duration, type, gainPeak){
    const ctx = ensureAudio();
    if(!ctx) return;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type || 'square';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0, ctx.currentTime);
    gain.gain.linearRampToValueAtTime(gainPeak || 0.12, ctx.currentTime + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
    osc.connect(gain).connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + duration);
  }
  function sfxClick(){ beep(320, 0.05, 'square', 0.06); }
  function sfxPiece(){ beep(660, 0.09, 'triangle', 0.1); setTimeout(() => beep(880, 0.12, 'triangle', 0.09), 60); }
  function sfxOverload(){ beep(140, 0.35, 'sawtooth', 0.08); }
  function sfxWin(){
    [523,659,784,1047].forEach((f,i) => setTimeout(() => beep(f, 0.25, 'triangle', 0.11), i*110));
  }

  function screenShake(){
    const wrapEl = document.querySelector('.wrap');
    wrapEl.classList.remove('screen-shake');
    void wrapEl.offsetWidth;
    wrapEl.classList.add('screen-shake');
  }

  function fmtTime(s){
    const m = Math.floor(s/60).toString().padStart(2,'0');
    const ss = Math.floor(s%60).toString().padStart(2,'0');
    return m + ':' + ss;
  }

  function loadBest(){
    const v = localStorage.getItem(BEST_KEY);
    bestTimeEl.textContent = v ? fmtTime(parseFloat(v)) : '--:--';
    return v ? parseFloat(v) : null;
  }
  let bestSeconds = loadBest();

  function bottleneckIndex(){
    let idx = 0;
    for(let i=1;i<rates.length;i++){ if(rates[i] < rates[idx]) idx = i; }
    return idx;
  }

  function popNumber(anchorEl, text, cls){
    const p = document.createElement('div');
    p.className = cls;
    p.textContent = text;
    anchorEl.appendChild(p);
    setTimeout(() => p.remove(), 800);
  }

  function buildLine(){
    lineEl.innerHTML = '';

    for(let i=0;i<NUM_STATIONS;i++){
      const bufCell = document.createElement('div');
      bufCell.className = 'cell';
      if(i > 0){
        const buf = document.createElement('div');
        buf.className = 'buffer';
        buf.id = 'buffer-' + i;
        const count = document.createElement('div');
        count.className = 'buffer-count';
        count.id = 'buffer-count-' + i;
        count.textContent = '0';
        bufCell.appendChild(buf);
        bufCell.appendChild(count);
      } else {
        const raw = document.createElement('div');
        raw.style.cssText = 'width:68px;min-height:140px;display:flex;align-items:center;justify-content:center;font-size:30px;';
        raw.textContent = '🌿';
        bufCell.appendChild(raw);
      }
      lineEl.appendChild(bufCell);

      const st = document.createElement('div');
      st.className = 'station';
      st.id = 'station-' + i;
      st.innerHTML = `
        <div class="hazard"></div>
        <div class="name">⚗️ ${i+1} <span class="status-dot" id="dot-${i}"></span></div>
        <div class="gear-wrap"><div class="gear" id="gear-${i}" style="animation-duration:${(2 - rates[i]/RATE_MAX*1.5).toFixed(2)}s"></div></div>
        <div class="util-bar"><div class="fill" id="util-fill-${i}"></div></div>
        <div class="rate-row">
          <span class="rv" id="rate-val-${i}">${rates[i]}</span>
          <span class="ru">un/min</span>
        </div>
        <input type="range" min="${RATE_MIN}" max="${RATE_MAX}" step="1" value="${rates[i]}" id="rate-slider-${i}">
      `;
      lineEl.appendChild(st);
      st.addEventListener('click', (e) => {
        if(e.target.tagName === 'INPUT') return;
        const pct = simSeconds > 0 ? Math.round((busyTime[i]/simSeconds)*100) : 0;
        popNumber(st, pct + '%', 'click-pop');
      });

      const arrow = document.createElement('div');
      arrow.className = 'arrow';
      arrow.id = 'arrow-' + i;
      arrow.innerHTML = '→<span class="flow-dot"></span>';
      lineEl.appendChild(arrow);
    }

    const outCell = document.createElement('div');
    outCell.className = 'cell out';
    outCell.innerHTML = `
      <div class="box" id="out-box">
        <div class="num" id="out-num">0</div>
        <div class="lab">🧪</div>
      </div>
    `;
    lineEl.appendChild(outCell);

    for(let i=0;i<NUM_STATIONS;i++){
      document.getElementById('rate-slider-' + i).addEventListener('input', (e) => {
        rates[i] = parseInt(e.target.value, 10);
        document.getElementById('rate-val-' + i).textContent = rates[i];
        document.getElementById('gear-' + i).style.animationDuration = (2 - rates[i]/RATE_MAX*1.5).toFixed(2) + 's';
        refreshBottleneckStyling();
        sfxClick();
      });
    }
    refreshBottleneckStyling();
  }

  function refreshBottleneckStyling(){
    const bIdx = bottleneckIndex();
    for(let i=0;i<NUM_STATIONS;i++){
      document.getElementById('station-' + i).classList.toggle('bottleneck', i === bIdx);
    }
    if(prevBottleneck !== null && prevBottleneck !== bIdx){
      const el = document.getElementById('station-' + bIdx);
      el.classList.remove('just-changed');
      void el.offsetWidth;
      el.classList.add('just-changed');
    }
    prevBottleneck = bIdx;
  }

  function renderBuffers(){
    for(let i=1;i<NUM_STATIONS;i++){
      const el = document.getElementById('buffer-' + i);
      const countEl = document.getElementById('buffer-count-' + i);
      const n = buffer[i];
      countEl.textContent = n;
      const isOverload = n >= OVERLOAD_THRESHOLD;
      if(isOverload && !wasOverload[i]){
        screenShake();
        sfxOverload();
      }
      wasOverload[i] = isOverload;
      el.classList.toggle('overload', isOverload);
      const currentUnits = el.querySelectorAll('.unit').length;
      const visible = Math.min(n, MAX_VISIBLE_BUFFER);
      if(visible > currentUnits){
        for(let k=currentUnits;k<visible;k++){
          const u = document.createElement('div');
          u.className = 'unit';
          el.appendChild(u);
        }
      } else if(visible < currentUnits){
        for(let k=currentUnits;k>visible;k--){
          el.removeChild(el.lastElementChild);
        }
      }
    }
  }

  function renderBars(){
    barsEl.innerHTML = '';
    const bIdx = bottleneckIndex();
    const bottleneckRatePerBucket = (rates[bIdx]/60) * BUCKET_SECONDS;
    const maxVal = Math.max(1, ...historyBuckets, bottleneckRatePerBucket * 1.3);
    historyBuckets.slice(-20).forEach(v => {
      const bar = document.createElement('div');
      bar.className = 'bar' + (v <= bottleneckRatePerBucket + 0.5 ? ' bottleneck-limited' : '');
      bar.style.height = Math.max(2, (v / maxVal) * 70) + 'px';
      barsEl.appendChild(bar);
    });
  }

  function launchConfetti(){
    const colors = ['#f5c518', '#3ecf8e', '#5aa9e6', '#e0524b', '#ffffff'];
    for(let i=0;i<80;i++){
      const s = document.createElement('span');
      s.style.left = Math.random()*100 + 'vw';
      s.style.background = colors[Math.floor(Math.random()*colors.length)];
      s.style.animationDuration = (1.6 + Math.random()*1.4) + 's';
      s.style.animationDelay = (Math.random()*0.4) + 's';
      s.style.opacity = 0.85;
      confettiEl.appendChild(s);
      setTimeout(() => s.remove(), 3500);
    }
  }

  function checkWin(){
    if(won || finished < GOAL) return;
    won = true;
    pause();
    launchConfetti();
    sfxWin();
    winTimeEl.textContent = fmtTime(simSeconds);
    if(bestSeconds === null || simSeconds < bestSeconds){
      localStorage.setItem(BEST_KEY, simSeconds.toString());
      bestSeconds = simSeconds;
      bestTimeEl.textContent = fmtTime(bestSeconds);
      winRecordEl.innerHTML = '🎉 <b>Novo recorde!</b>';
    } else {
      winRecordEl.innerHTML = 'Recorde: <b>' + fmtTime(bestSeconds) + '</b>';
    }
    winOverlay.classList.add('show');
  }

  function tick(){
    for(let s=0; s<speedMult; s++){
      simSeconds += DT;
      bucketTimer += DT;

      for(let i=0;i<NUM_STATIONS;i++){
        const rateSec = rates[i] / 60;
        const hasInput = (i === 0) ? true : buffer[i] > 0;
        busy[i] = hasInput;
        if(hasInput) busyTime[i] += DT;
        if(hasInput){
          progress[i] += rateSec * DT;
          if(progress[i] >= 1){
            progress[i] -= 1;
            if(i > 0) buffer[i] -= 1;
            const arrowEl = document.getElementById('arrow-' + i);
            if(arrowEl){
              arrowEl.classList.remove('flowing');
              void arrowEl.offsetWidth;
              arrowEl.classList.add('flowing');
            }
            if(i === NUM_STATIONS - 1){
              finished += 1;
              const box = document.getElementById('out-box');
              box.classList.remove('bump');
              void box.offsetWidth;
              box.classList.add('bump');
              popNumber(box, '+1', 'float-plus');
              sfxPiece();
            } else {
              buffer[i+1] += 1;
            }
          }
        }
      }

      if(bucketTimer >= BUCKET_SECONDS){
        const produced = finished - lastFinishedAtBucket;
        historyBuckets.push(produced);
        if(historyBuckets.length > 40) historyBuckets.shift();
        lastFinishedAtBucket = finished;
        bucketTimer = 0;
      }
    }

    finishedEl.textContent = finished;
    document.getElementById('out-num').textContent = finished;
    simTimeEl.textContent = fmtTime(simSeconds);
    goalFillEl.style.width = Math.min(100, (finished/GOAL)*100) + '%';

    for(let i=0;i<NUM_STATIONS;i++){
      document.getElementById('dot-' + i).className = 'status-dot ' + (busy[i] ? 'busy' : 'idle');
      document.getElementById('gear-' + i).classList.toggle('idle', !busy[i]);
      const pct = simSeconds > 0 ? Math.min(100, Math.round((busyTime[i]/simSeconds)*100)) : 0;
      const fill = document.getElementById('util-fill-' + i);
      fill.style.width = pct + '%';
      fill.style.background = pct >= 85 ? 'var(--yellow)' : (pct <= 40 ? 'var(--red)' : 'var(--green)');
    }

    renderBuffers();
    renderBars();
    refreshBottleneckStyling();
    checkWin();
  }

  function start(){
    if(running || won) return;
    running = true;
    playBtn.textContent = '⏸ Pausar';
    tickHandle = setInterval(tick, DT*1000);
  }
  function pause(){
    running = false;
    playBtn.textContent = '▶ Continuar';
    clearInterval(tickHandle);
  }
  function reset(){
    pause();
    playBtn.textContent = '▶ Iniciar';
    rates = DEFAULT_RATES.slice();
    progress = new Array(NUM_STATIONS).fill(0);
    buffer = new Array(NUM_STATIONS).fill(0);
    busy = new Array(NUM_STATIONS).fill(false);
    busyTime = new Array(NUM_STATIONS).fill(0);
    finished = 0;
    simSeconds = 0;
    historyBuckets = [];
    lastFinishedAtBucket = 0;
    bucketTimer = 0;
    prevBottleneck = null;
    won = false;
    wasOverload = new Array(NUM_STATIONS).fill(false);
    winOverlay.classList.remove('show');
    buildLine();
    renderBuffers();
    renderBars();
    finishedEl.textContent = '0';
    document.getElementById('out-num').textContent = '0';
    simTimeEl.textContent = '00:00';
    goalFillEl.style.width = '0%';
  }

  playBtn.addEventListener('click', () => { ensureAudio(); running ? pause() : start(); });
  resetBtn.addEventListener('click', reset);
  winPlayAgain.addEventListener('click', () => { reset(); start(); });
  speedGroup.addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-speed]');
    if(!btn) return;
    speedMult = parseInt(btn.dataset.speed, 10);
    [...speedGroup.children].forEach(b => b.classList.toggle('active', b === btn));
  });

  buildLine();
  renderBuffers();
  renderBars();
})();
</script>
</body>
</html>
