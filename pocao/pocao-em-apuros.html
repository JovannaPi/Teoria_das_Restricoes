[],concept:`Uma loja é um sistema: as poções só chegam ao cliente depois de passar por todas as etapas da receita.`,question:{question:`Na loja, o que realmente gera dinheiro para a Lina?`,options:[`Manter todas as estações ocupadas o tempo todo.`,`Poções entregues e pagas pelos clientes.`,`Ter muitos ingredientes guardados na despensa.`],correct:1,explanation:`Só a venda gera ganho. Estação ocupada produzindo o que ninguém comprou, ou ingrediente parado na prateleira, é dinheiro preso — não ganho.`},lockedPolicies:[`release`,`drum`,`bufferSize`,`priority`,`inspection`,`keepBusy`,`setupExternal`,`breakCover`],hypothesisEnabled:!1,showLoadLens:!1,speedOptions:[1,2],refProfit:100,refWip:4,revealConstraint:null},{id:`fase1`,mode:`desafio`,number:1,title:`A Loja Entupida`,subtitle:`Primeiro Círculo — Identificar`,tocStep:`1. Identificar a restrição`,goalText:`Descubra qual estação limita as entregas da loja e registre sua hipótese.`,scenario:o({id:`fase1`,seed:4242,stations:{embalagem:{breakEvery:50,breakDuration:10}},policies:{release:`empurrar`,autoAccept:!0,autoReorder:!0}}),objectives:[{kind:`hypothesis`,target:1,label:`Registrar a hipótese correta sobre a restrição`},{kind:`delivered`,target:18,label:`Entregar pelo menos 18 poções`},{kind:`reputation`,target:1,label:`Manter a reputação acima de zero`}],intro:[{who:`mentora`,text:`Primeiro Círculo, Lina. A loja está entupida: clientes reclamando, poções atrasadas, aprendizes correndo para todo lado.`},{who:`aprendiz`,text:`É a embalagem, Vó! Toda hora eu olho e a moça da embalagem está parada tomando chá!`},{who:`mentora`,text:`Tico acha. Eu não acho nada: eu observo. Clique nas estações, abra a Análise e veja onde o trabalho se acumula e quanto cada uma consegue produzir.`},{who:`mentora`,text:`Quando tiver certeza, registre sua hipótese na estação que você acredita que limita a loja inteira. Eu confiro os dados.`}],outroWin:[{who:`mentora`,text:`Isso! O caldeirão. Ele trabalha sem parar e a fila na frente dele só cresce. Cada minuto do caldeirão é um minuto da loja inteira.`},{who:`aprendiz`,text:`Mas a embalagem vivia parada…`},{who:`mentora`,text:`E podia ficar! Ela produz mais do que chega até ela. Parada não é o mesmo que gargalo, Tico.`}],outroLose:[{who:`mentora`,text:`Ainda não. Observe onde o trabalho se acumula e qual estação está sempre ocupada. Tente de novo.`}],concept:`A restrição é o recurso que limita o desempenho do sistema inteiro. Indícios: trabalha praticamente 100% do tempo, tem fila crescente na frente e sua capacidade (para o mix de pedidos) é a menor da loja.`,question:{question:`A embalagem ficava parada várias vezes por dia. Por que ela NÃO era a restrição?`,options:[`Porque ela é barata de operar.`,`Porque, mesmo com as pausas, ela consegue embalar mais poções do que o caldeirão consegue entregar a ela.`,`Porque ela fica no fim do processo, e a restrição sempre fica no começo.`],correct:1,explanation:`Uma estação só limita a loja se sua capacidade for menor que o que o sistema precisa dela. A embalagem tem folga: ficar parada esperando poções é normal para um recurso que não é restrição. A posição no processo não importa.`},lockedPolicies:[`release`,`drum`,`bufferSize`,`priority`,`inspection`,`keepBusy`,`setupExternal`,`breakCover`],hypothesisEnabled:!0,showLoadLens:!1,speedOptions:s,refProfit:650,refWip:14,revealConstraint:null},{id:`fase2`,mode:`desafio`,number:2,title:`O Caldeirão Nunca Para`,subtitle:`Segundo Círculo — Explorar`,tocStep:`2. Explorar a restrição`,goalText:`Tire o máximo do caldeirão que você já tem — sem comprar nada.`,scenario:o({id:`fase2`,seed:777,demand:{...i,ordersPerMin:3.3},stations:{caldeirao:{breakEvery:45,breakDuration:9,setupTime:3}},policies:{release:`corda`,drum:`caldeirao`,bufferSize:1,priority:`fifo`,inspection:`final`,autoAccept:!0,autoReorder:!0}}),objectives:[{kind:`delivered`,target:24,label:`Entregar pelo menos 24 poções`},{kind:`netProfit`,target:550,label:`Lucro líquido do dia de pelo menos 550 moedas`},{kind:`reputation`,target:1,label:`Manter a reputação acima de zero`}],intro:[{who:`mentora`,text:`Segundo Círculo. Já sabemos que o caldeirão manda no ritmo da loja. Um minuto perdido no caldeirão é um minuto perdido da loja inteira.`},{who:`mentora`,text:`E ele perde muitos minutos: espera a bancada preparar cada kit, para para limpeza, a equipe sai para o chá e ainda ferve poção que vai ser reprovada no fim.`},{who:`protagonista`,text:`Posso comprar outro caldeirão?`},{who:`mentora`,text:`Ainda não. Antes de gastar, aproveite o que você já tem. Clique no caldeirão e veja para onde vai o tempo dele. As decisões estão no painel Fluxo e na própria estação.`}],outroWin:[{who:`mentora`,text:`Viu? Mesmo caldeirão, mesma equipe, mais poções entregues. A capacidade estava lá — só estava sendo desperdiçada.`}],outroLose:[{who:`mentora`,text:`O caldeirão continuou parando por motivos evitáveis. Abra o painel do caldeirão e veja quanto tempo ele passa ocioso, limpando ou em pausa.`}],concept:`Explorar a restrição é tirar o máximo dela sem investir: nunca deixá-la sem trabalho (pulmão), tirar dela tarefas que outros podem fazer (preparação em paralelo), cobrir pausas, não gastar seu tempo com itens defeituosos e priorizar o que gera mais ganho por minuto dela.`,question:{question:`Por que vale a pena pagar uma aprendiz extra para limpar o caldeirão em paralelo, mas não para limpar a bancada de preparo?`,options:[`Porque o caldeirão é mais caro.`,`Porque um minuto ganho no caldeirão vira um minuto a mais para a loja inteira; um minuto ganho no preparo, que já tem folga, não muda as entregas.`,`Porque a bancada de preparo nunca precisa de limpeza.`],correct:1,explanation:`O ganho da loja é limitado pela restrição. Acelerar um recurso com folga só aumenta a folga dele; acelerar a restrição aumenta as entregas de todos.`},lockedPolicies:[`release`,`drum`,`keepBusy`],hypothesisEnabled:!1,showLoadLens:!0,speedOptions:s,refProfit:800,refWip:6,revealConstraint:`caldeirao`},{id:`fase3`,mode:`desafio`,number:3,title:`A Rebelião dos Aprendizes`,subtitle:`Terceiro Círculo — Subordinar`,tocStep:`3. Subordinar tudo à restrição`,goalText:`Faça a loja inteira trabalhar no ritmo do caldeirão e controle o estoque em processo.`,scenario:o({id:`fase3`,seed:3003,demand:{...i,ordersPerMin:3.6},stations:{caldeirao:{breakEvery:45,breakDuration:9,setupTime:3}},wipHoldingCost:.08,spoilTime:45,policies:{release:`empurrar`,drum:`caldeirao`,bufferSize:4,priority:`ganho`,inspection:`entrada`,keepBusy:!0,setupExternal:{caldeirao:!0},breakCover:{caldeirao:!0},autoAccept:!0,autoReorder:!0}}),objectives:[{kind:`avgWip`,target:9,label:`Estoque em processo médio de no máximo 9 poções`},{kind:`netProfit`,target:500,label:`Lucro líquido do dia de pelo menos 500 moedas`},{kind:`canceled`,target:2,label:`No máximo 2 pedidos cancelados`}],intro:[{who:`aprendiz`,text:`Vó, organizei tudo! Agora ninguém fica parado: assim que um pedido chega a gente já prepara tudo, e quando não tem pedido a gente adianta Poção de Cura!`},{who:`mentora`,text:`Hmm. E onde está tudo isso que vocês adiantaram, Tico?`},{who:`aprendiz`,text:`…na frente do caldeirão. Esperando. Algumas ervas murcharam.`},{who:`mentora`,text:`Lina, o caldeirão já está bem explorado. Agora o resto da loja precisa seguir o ritmo dele. No painel Fluxo você decide como o trabalho é liberado.`}],outroWin:[{who:`mentora`,text:`A bancada agora fica ociosa às vezes — e está tudo bem! Ela trabalha no compasso do caldeirão. Menos poção parada, menos erva murcha, pedidos mais rápidos.`}],outroLose:[{who:`mentora`,text:`Poções demais esperando na frente do caldeirão. Produzir mais do que a restrição consegue processar só cria fila, desperdício e atraso.`}],concept:`Subordinar é fazer todos os recursos não-restritivos trabalharem para sustentar a restrição, e não para se manter ocupados. O sistema tambor-pulmão-corda libera trabalho no ritmo do tambor (a restrição), mantendo só um pequeno pulmão na frente dela.`,question:{question:`Depois de amarrar a corda ao caldeirão, a bancada de preparo passou a ficar parada parte do dia. O que isso significa?`,options:[`Que a bancada tem gente demais e deve ser fechada.`,`Que é desperdício: ela deveria continuar adiantando poções.`,`Que ela tem capacidade de sobra; ficar ociosa é melhor do que produzir estoque que a restrição não consegue processar.`],correct:2,explanation:`Ociosidade num recurso não-restritivo é esperada. A produção extra não aumentaria as entregas (o caldeirão continuaria no mesmo ritmo) e só criaria filas, ingredientes murchos e custos de estoque.`},lockedPolicies:[],hypothesisEnabled:!1,showLoadLens:!0,speedOptions:s,refProfit:850,refWip:6,revealConstraint:`caldeirao`},{id:`fase4`,mode:`desafio`,number:4,title:`O Grande Investimento`,subtitle:`Quarto Círculo — Elevar`,tocStep:`4. Elevar a restrição`,goalText:`A procura aumentou. Decida se, onde e quando investir para atender mais clientes.`,scenario:o({id:`fase4`,seed:4004,startCash:650,demand:{...i,ordersPerMin:4.7,mix:{cura:.5,visao:.3,transformacao:.2}},stations:{caldeirao:{breakEvery:45,breakDuration:9,setupTime:3}},wipHoldingCost:.06,spoilTime:45,policies:{release:`corda`,drum:`caldeirao`,bufferSize:4,priority:`ganho`,inspection:`entrada`,keepBusy:!1,setupExternal:{caldeirao:!0},breakCover:{caldeirao:!0},autoAccept:!0,autoReorder:!0},upgrades:[`caldeirao_extra`,`cristal_fervura`,`alambique_duplo`,`serpentina_gelo`,`embaladora_encantada`,`bancada_extra`],events:[{at:20,kind:`feira`,recipe:`visao`,duration:60}]}),objectives:[{kind:`delivered`,target:37,label:`Entregar pelo menos 37 poções`},{kind:`netProfit`,target:900,label:`Lucro líquido do dia de pelo menos 900 moedas`},{kind:`cash`,target:1e3,label:`Terminar o dia com pelo menos 1000 moedas em caixa`}],intro:[{who:`comerciante`,text:`Lina, querida! A notícia correu: a loja Brasaverde voltou. Trouxe catálogo de equipamentos — tudo de primeira, parcelamento em três luas.`},{who:`mentora`,text:`A procura cresceu e o caldeirão já est   <body data-screen="title">
    <div id="app">

          <div id="title-menu"></div>
          <div id="title-panel" hidden></div>
        </div>
        <noscript><p>Este jogo precisa de JavaScript.</p></noscript>
      </section>
      <section id="game-screen" class="screen hidden">
        <header id="hud"></header>
        <div id="game-main">
          <div id="stage-wrap">
            <div id="stage">
              <canvas id="shop" aria-label="Oficina de poções: clique nas estações para ver detalhes" role="img"></canvas>
              <div id="overlay"></div>
            </div>
          </div>
          <aside id="side" aria-label="Painel de detalhes"></aside>
        </div>
        <div id="station-strip" aria-label="Estações da loja"></div>
        <footer id="bottom"></footer>
        <nav id="tabbar" aria-label="Painéis do jogo"></nav>
      </section>
      <div id="modal-root"></div>
      <div id="toasts" aria-live="polite"></div>
    </div>
